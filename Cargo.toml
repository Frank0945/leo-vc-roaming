[package]
name = "leo-vc-roaming"
version = "0.1.0"
edition = "2024"

[dependencies]
async-std = { version = "1.12", features = ["attributes"] }
ark-bls12-381 = { version = "0.4", features = ["curve"] }
ark-ff = "0.4"
ark-serialize = "0.4"
base64 = "0.22"
bbs_plus = "0.25"
dock_crypto_utils = "0.23"
libc = "0.2"
rand = "0.8"
schnorr_pok = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
